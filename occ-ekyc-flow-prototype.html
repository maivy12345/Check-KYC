<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCC · eKYC Flow Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* OCC */
  --occ-red:#C91F26; --heading:#2C2C2C; --body:#495057; --muted:#6C757D;
  --surface:#F8F9FA; --divider:#E9ECEF;
  /* Salesforce-like */
  --sf-bg:#F3F3F3; --sf-blue:#0176D3; --sf-blue-dark:#014486; --sf-border:#C9C9C9;
  --sf-ink:#181818; --sf-green:#2E844A; --sf-amber:#FE9339; --sf-red:#BA0517;
  /* Veriff */
  --vf-dark:#0B2B26; --vf-mint:#12E3AE; --vf-grey:#5A6B68;
  /* chrome */
  --chrome:#1B1D21; --chrome-2:#2A2D33;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;background:var(--sf-bg);color:var(--sf-ink);font-size:14px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sf-blue);outline-offset:2px}

/* ---------- APP CHROME ---------- */
#appbar{position:sticky;top:0;z-index:60;background:var(--chrome);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brandmark .dot{width:9px;height:9px;border-radius:50%;background:var(--occ-red)}
.brandmark small{font-weight:400;color:#9AA0A6;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
#tabs{display:flex;gap:4px;margin-left:8px;flex:1;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;color:#C7CBD1;padding:6px 12px;border-radius:100px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{background:var(--chrome-2);color:#fff}
.tab[aria-selected="true"]{background:#fff;color:#111;font-weight:600}
.tab .count{background:var(--occ-red);color:#fff;border-radius:100px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.tab[aria-selected="true"] .count{background:var(--occ-red)}
.chrome-actions{display:flex;gap:8px;align-items:center}
.cbtn{background:var(--chrome-2);border:1px solid #3A3E45;color:#E6E8EB;padding:6px 11px;border-radius:var(--r);font-size:12.5px;font-weight:500}
.cbtn:hover{background:#3A3E45}
.clock{font-size:11.5px;color:#8B9199;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- LAYOUT ---------- */
#stage{display:flex;min-height:calc(100vh - 52px)}
#views{flex:1;min-width:0}
.view{display:none;padding:18px}
.view.active{display:block}

/* log rail */
#rail{width:300px;flex:0 0 300px;background:#101215;color:#C9CDD3;border-left:1px solid #000;display:none;flex-direction:column}
#rail.open{display:flex}
#rail h4{margin:0;padding:14px 16px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7A828C;font-weight:600;border-bottom:1px solid #22262B}
#logitems{flex:1;overflow-y:auto;padding:8px 0;max-height:calc(100vh - 100px)}
.logitem{padding:9px 16px;border-bottom:1px solid #1A1D22;font-size:12px;line-height:1.45}
.logitem .lt{color:#5E6670;font-variant-numeric:tabular-nums;font-size:10.5px}
.logitem .ls{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-right:6px}
.ls.crm{background:#12324F;color:#6FB6F0}
.ls.mail{background:#3F2E12;color:#F0BE6F}
.ls.veriff{background:#0E3A32;color:var(--vf-mint)}
.ls.admin{background:#3A1220;color:#F08FA6}
.ls.portal{background:#3A2A12;color:#E0B06A}
.ls.api{background:#22262B;color:#A9B1BA}


/* ---------- SALESFORCE GLOBAL HEADER ---------- */
.sfg{position:relative;background:#fff;border:1px solid var(--sf-border);border-bottom:none;
  border-radius:var(--r) var(--r) 0 0;padding:9px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sfg-app{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.sfg-grid{color:#706E6B;font-size:17px;letter-spacing:-2px}
.sfg-cloud{width:32px;height:23px;border-radius:12px;background:#00A1E0;color:#fff;display:grid;place-items:center;font-size:13px}
.sfg-search{flex:1;min-width:170px;max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--sf-border);
  border-radius:100px;padding:6px 14px;font-size:13px;color:#8A8A8A;display:flex;gap:8px;align-items:center}
.sfg-ic{display:flex;align-items:center;gap:11px;color:#5C5C5C;font-size:14px}
.sfg-bell{position:relative;background:none;border:none;font-size:15px;padding:2px 4px;line-height:1}
.sfg-bell.on{color:var(--sf-blue)}
.sfg-dot{position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:#0176D3;border:1.5px solid #fff}
.sfg-av{width:26px;height:26px;border-radius:50%;background:#EDEDED;display:grid;place-items:center;font-size:13px}
.sfg-panel{position:absolute;top:46px;right:12px;width:min(460px,calc(100% - 24px));background:#fff;
  border:1px solid #D8D8D8;border-radius:4px;box-shadow:0 10px 32px rgba(0,0,0,.22);z-index:40;overflow:hidden}
.sfg-panel-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #E5E5E5}
.sfg-panel-hd b{font-size:15px;color:#181818}
.sfg-panel-hd span{display:flex;align-items:center;gap:12px}
.sfg-panel-hd a{color:var(--sf-blue);font-size:12.5px;text-decoration:underline;cursor:pointer}
.sfg-x{background:none;border:none;font-size:17px;color:#706E6B;line-height:1;padding:0 2px}
.sfg-panel-bd{max-height:430px;overflow-y:auto}
.sfg-item{display:flex;gap:11px;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid #EDEDED;padding:12px 14px}
.sfg-item:hover{background:#F3F8FE}
.sfg-item.unread{background:#FAFCFF}
.sfg-ico{flex:0 0 30px;height:30px;border-radius:5px;background:#0176D3;color:#fff;display:grid;place-items:center;font-size:14px}
.sfg-tx{flex:1;min-width:0}
.sfg-tx b{display:block;font-size:13px;color:#181818;line-height:1.35}
.sfg-tx span{display:block;font-size:12.5px;color:#3E3E3C;line-height:1.45;margin-top:1px}
.sfg-tx i{display:flex;align-items:center;gap:6px;font-style:normal;font-size:11.5px;color:#706E6B;margin-top:5px}
.sfg-udot{width:7px;height:7px;border-radius:50%;background:#0176D3;display:inline-block}
.sfg-empty{padding:26px 14px;text-align:center;font-size:13px;color:#706E6B}
.sf-tabbar{border-radius:0}
@media (max-width:900px){ .sfg-search{display:none} .sfg-panel{right:6px} }

/* ---------- SF PAGE ---------- */
.sf-tabbar{background:#fff;border:1px solid var(--sf-border);border-radius:var(--r) var(--r) 0 0;padding:8px 14px;display:flex;align-items:center;gap:12px;font-size:13px;color:#444}
.sf-tabbar .app{font-weight:700;font-size:15px;color:#181818}
.sf-card{background:#fff;border:1px solid var(--sf-border);border-radius:var(--r);margin-bottom:14px}
.sf-hd{padding:14px 16px;border-bottom:1px solid #E5E5E5;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sf-obj{display:flex;gap:12px;align-items:center}
.sf-icon{width:34px;height:34px;border-radius:5px;background:var(--sf-blue);display:grid;place-items:center;color:#fff;font-size:16px}
.sf-obj .lbl{font-size:11px;color:#5C5C5C}
.sf-obj .val{font-size:19px;font-weight:600;letter-spacing:-.01em}
.sf-actions{display:flex;gap:6px;flex-wrap:wrap}
.sfbtn{background:#fff;border:1px solid var(--sf-border);color:var(--sf-blue);padding:6px 13px;border-radius:4px;font-size:13px;font-weight:500}
.sfbtn:hover{background:#F3F3F3}
.sfbtn.primary{background:var(--sf-blue);border-color:var(--sf-blue);color:#fff}
.sfbtn.primary:hover{background:var(--sf-blue-dark)}
.sfbtn:disabled{opacity:.45;cursor:not-allowed}
.sf-meta{display:flex;gap:34px;padding:12px 16px;border-bottom:1px solid #E5E5E5;flex-wrap:wrap}
.sf-meta .k{font-size:11px;color:#5C5C5C;margin-bottom:2px}
.sf-meta .v{font-size:13.5px;font-weight:500}
.pk{display:flex;align-items:center;gap:7px}
.pk .bulb{width:12px;height:12px;border-radius:50%;background:#C9C9C9;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.pk.on .bulb{background:var(--sf-green);box-shadow:0 0 0 3px rgba(46,132,74,.18)}
.sf-path{display:flex;padding:12px 16px;gap:3px;overflow-x:auto}
.step{flex:1;min-width:96px;background:#ECEBEA;color:#514F4D;font-size:12px;font-weight:600;padding:8px 10px;text-align:center;position:relative;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
.step:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%)}
.step.done{background:var(--sf-blue);color:#fff}
.step.current{background:#032D60;color:#fff}
.sf-sub{border-bottom:1px solid #E5E5E5;padding:0 16px;display:flex;gap:22px;overflow-x:auto}
.sf-sub button{background:none;border:none;border-bottom:3px solid transparent;padding:11px 2px;font-size:13.5px;color:#444;font-weight:500;white-space:nowrap}
.sf-sub button[aria-selected="true"]{color:var(--sf-blue);border-bottom-color:var(--sf-blue);font-weight:600}
.rl-hd{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rl-hd .t{font-size:14.5px;font-weight:600}
.rl-hd .s{font-size:11.5px;color:#5C5C5C}
table.sf{width:100%;border-collapse:collapse;font-size:13px}
table.sf th{text-align:left;font-size:11.5px;font-weight:600;color:#5C5C5C;background:#FAFAF9;border-top:1px solid #E5E5E5;border-bottom:1px solid #E5E5E5;padding:8px 12px;white-space:nowrap}
table.sf td{padding:11px 12px;border-bottom:1px solid #EDEDED;vertical-align:middle}
table.sf tr:hover td{background:#F8FBFF}
.link{color:var(--sf-blue);text-decoration:none;font-weight:500}
.link:hover{text-decoration:underline}
.nm{font-weight:500}
.sub{font-size:11.5px;color:var(--muted)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;white-space:nowrap;border:1px solid transparent}
.b-idle{background:#F3F3F3;color:#5C5C5C;border-color:#DDD}
.b-sent{background:#EAF5FE;color:#0B5CAB;border-color:#C9E2FA}
.b-prog{background:#FFF7E6;color:#8A5300;border-color:#FBE3B8}
.b-review{background:#FDF0F4;color:#9E1B44;border-color:#F6CFDC}
.b-ok{background:#EBF7EE;color:#1B6B36;border-color:#C7E7D2}
.b-fail{background:#FEECEB;color:#A6120C;border-color:#F7CDCB}
.b-exp{background:#F4F1FB;color:#5B4B9E;border-color:#DED6F3}

.countdown{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.countdown.warn{color:#8A5300;font-weight:600}
.countdown.dead{color:#A6120C;font-weight:600}

/* ---------- MODAL ---------- */
#scrim{position:fixed;inset:0;background:rgba(8,10,14,.55);display:none;z-index:80;padding:24px;overflow-y:auto}
#scrim.open{display:block}
.modal{background:#fff;max-width:760px;margin:0 auto;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--divider);display:flex;justify-content:space-between;align-items:center}
.modal-hd h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.x{background:none;border:none;font-size:22px;line-height:1;color:#7A7A7A;padding:2px 6px}
.modal-bd{padding:18px 20px;max-height:64vh;overflow-y:auto}
.modal-ft{padding:14px 20px;border-top:1px solid var(--divider);display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);flex-wrap:wrap}
.fieldlabel{font-size:11.5px;font-weight:600;color:#5C5C5C;text-transform:uppercase;letter-spacing:.05em;margin:0 0 7px}
.recipient{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--divider);border-radius:var(--r);margin-bottom:8px;background:#fff}
.recipient.off{background:#FBFBFC;opacity:.72}
.recipient input{margin-top:3px;width:15px;height:15px;accent-color:var(--sf-blue)}
.recipient .who{flex:1;min-width:0}
.recipient .why{font-size:11.5px;color:var(--muted);margin-top:3px}
.tmpl{border:1px solid var(--divider);border-radius:var(--r);overflow:hidden}
.tmpl .row{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--divider);font-size:13px;align-items:baseline}
.tmpl .row .k{width:62px;flex:0 0 62px;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tmpl input.subj{flex:1;border:none;font:inherit;font-weight:500;padding:0;outline:none;min-width:0}
.tmpl textarea{width:100%;border:none;padding:14px 12px;font:inherit;font-size:13px;line-height:1.65;resize:vertical;min-height:190px;outline:none;color:var(--body)}
.tok{background:#FFF1F1;color:var(--occ-red);border:1px solid #F6D5D6;border-radius:3px;padding:0 4px;font-size:12px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.notice{display:flex;gap:9px;padding:11px 13px;border-radius:var(--r);font-size:12.5px;line-height:1.55;margin-bottom:16px}
.notice.amber{background:#FFF8EC;border:1px solid #F6E1BE;color:#7A4E00}
.notice.blue{background:#F0F7FE;border:1px solid #CCE3F8;color:#0B4A85}


/* ---------- POPUP SEND EMAIL KYC ---------- */
.modal{max-width:1000px}
.kyc-hd{position:relative;text-align:center;padding:22px 24px 18px;border-bottom:1px solid #E5E5E5}
.kyc-hd h3{margin:0;font-size:20px;font-weight:700;color:#181818;letter-spacing:-.01em}
.kyc-sub{font-size:12.5px;color:#5C5C5C;margin-top:3px}
.kyc-x{position:absolute;top:-42px;right:-2px;width:34px;height:34px;background:#fff;border:2px solid var(--sf-blue);
  border-radius:3px;color:var(--sf-blue);font-size:15px;line-height:1;display:grid;place-items:center}
.kyc-x:hover{background:#F0F7FE}
.kyc-bd{padding:20px 24px 26px;max-height:62vh;overflow-y:auto}
.kyc-banner{background:#F0F7FE;border:1px solid #CCE3F8;border-radius:4px;padding:11px 14px;font-size:13px;color:#032D60}
.kyc-count{font-size:12.5px;color:#5C5C5C;margin:14px 0 10px}
.kyc-sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.kyc-sec-t{font-size:16px;font-weight:600;color:#181818}
.kyc-sec-a{display:flex;gap:8px}
table.kyc{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.kyc col.c-cbx{width:38px}
table.kyc col.c-nm{width:28%}
table.kyc col.c-ty{width:14%}
table.kyc col.c-st{width:14%}
table.kyc col.c-d1{width:22%}
table.kyc col.c-d2{width:22%}
table.kyc td.nm{overflow-wrap:anywhere}
table.kyc th{text-align:left;font-size:12px;font-weight:600;color:#514F4D;padding:9px 10px;
  border-top:1px solid #E5E5E5;border-bottom:1px solid #E5E5E5}
table.kyc td{padding:11px 10px;border-bottom:1px solid #EDEDED;color:#181818}
table.kyc td.nm{font-weight:500}
table.kyc .cbx{width:38px;text-align:center}
table.kyc input[type=checkbox]{width:15px;height:15px;accent-color:var(--sf-blue)}
.kyc-none{font-size:13px;color:#5C5C5C;padding:18px 2px}
.kyc-badge{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:100px;white-space:nowrap}
.k-idle{background:#ECEBEA;color:#514F4D}
.k-sent{background:#E5E5E5;color:#3E3E3C}
.k-pass{background:#2E844A;color:#fff}
.k-exp{background:#F4F1FB;color:#5B4B9E}
.k-rev{background:#FDF0F4;color:#9E1B44}
.k-fail{background:#FEECEB;color:#A6120C}

.kyc-ft{padding:14px 24px;border-top:1px solid #E5E5E5;display:flex;justify-content:flex-end;gap:9px;background:#fff}
.kyc-stripe{background:repeating-linear-gradient(135deg,#E8A33D 0 9px,#DD9333 9px 18px);
  color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:11px 18px}
.mail-field{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid #E5E5E5;font-size:13px}
.mf-k{color:#5C5C5C;font-size:12.5px;flex:0 0 40px}
.mf-v{color:#181818}
.mf-v.mf-blank{min-height:18px}
.mf-input{width:100%;border:1px solid var(--sf-border);border-radius:4px;padding:9px 11px;font:inherit;font-size:13px;color:#181818}
.mf-input:focus{outline:2px solid var(--sf-blue);outline-offset:-1px;border-color:var(--sf-blue)}
.rt{border:1px solid var(--sf-border);border-radius:4px;overflow:hidden}
.rt-bar{display:flex;align-items:center;gap:5px;padding:7px 9px;border-bottom:1px solid var(--sf-border);background:#fff;flex-wrap:wrap}
.rt-sel{border:1px solid var(--sf-border);border-radius:4px;padding:4px 6px;font-size:12px;font-family:inherit;color:#181818;background:#fff}
.rt-sel.sm{width:66px}
.rt-g{display:flex;gap:2px;padding-left:6px;margin-left:2px;border-left:1px solid #E5E5E5}
.rt-b{width:28px;height:26px;border:none;background:none;border-radius:3px;color:#514F4D;font-size:12.5px;display:grid;place-items:center}
.rt-b:hover{background:#F3F3F3}
.rt-body{padding:16px;background:var(--surface);min-height:230px}
.rt-edit{outline:none;border-radius:3px}
.rt-edit:hover{box-shadow:0 0 0 1px #DCE3EA}
.rt-edit:focus{background:#FBFDFF}
@media (max-width:900px){
  .kyc-x{top:8px;right:8px}
  .kyc-bd{padding:16px 14px}
  table.kyc{font-size:12px}
  table.kyc th,table.kyc td{padding:8px 6px}
}


/* ---------- PORTAL WEB ---------- */
.pw{display:flex;background:#fff;border:1px solid var(--sf-border);border-radius:8px;overflow:hidden;min-height:640px}
.pw-side{width:214px;flex:0 0 214px;border-right:1px solid var(--divider);padding:16px 12px;background:#fff}
.pw-logo{padding:4px 8px 18px}
.pw-logo img{display:block;width:150px;height:auto}
.pw-nav{display:block;padding:9px 12px;border-radius:6px;font-size:13px;color:#3E3E3C;text-decoration:none;cursor:pointer;margin-bottom:2px}
.pw-nav:hover{background:var(--surface)}
.pw-nav.on{background:var(--occ-red);color:#fff;font-weight:600}
.pw-gov{margin-top:18px;background:#F1F4F8;border-radius:8px;padding:12px}
.pw-gov b{display:block;font-size:12.5px;color:var(--heading);margin-bottom:4px}
.pw-gov span{font-size:11.5px;color:var(--muted);line-height:1.45}
.pw-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pw-top{position:relative;background:linear-gradient(90deg,#C8102E,#A5121F);padding:12px 18px;display:flex;align-items:center;gap:16px;color:#fff;flex-wrap:wrap}
.pw-search{flex:1;min-width:180px;background:rgba(255,255,255,.16);border-radius:8px;padding:8px 12px;font-size:12.5px;color:#FFD9DD;display:flex;gap:8px;align-items:center}
.pw-sel{margin-left:auto;color:#fff;font-weight:500}
.pw-cs{display:flex;gap:8px;align-items:center;font-size:11.5px}
.pw-cs b{display:block;font-size:12.5px}
.pw-cs i{font-style:normal;opacity:.85}
.pw-av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:13px}
.pw-bell{position:relative;background:rgba(255,255,255,.14);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:15px}
.pw-dot{position:absolute;top:-3px;right:-3px;background:#fff;color:var(--occ-red);font-size:10px;font-weight:700;border-radius:100px;padding:1px 5px}
.pw-user{background:rgba(255,255,255,.14);border-radius:100px;padding:5px 12px 5px 6px;font-size:12.5px;display:flex;gap:7px;align-items:center}
.pw-bell-panel{position:absolute;top:56px;right:120px;width:330px;background:#fff;border:1px solid var(--divider);
  border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.22);z-index:20;overflow:hidden;color:var(--heading)}
.pw-bell-hd{padding:11px 14px;border-bottom:1px solid var(--divider);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pw-noti{display:flex;gap:10px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--divider);padding:12px 14px}
.pw-noti:hover{background:var(--surface)}
.pw-noti.unread{background:#FFF6F6}
.pw-noti.stale{opacity:.6}
.pw-noti-ic{flex:0 0 30px;height:30px;border-radius:50%;background:#FDECEE;display:grid;place-items:center;font-size:14px}
.pw-noti b{display:block;font-size:13px;color:var(--heading)}
.pw-noti-b{display:block;font-size:11.5px;color:var(--body);line-height:1.5;margin-top:2px}
.pw-noti-t{display:block;font-size:10.5px;color:var(--muted);margin-top:4px}
.pw-noti-empty{padding:22px 14px;font-size:12.5px;color:var(--muted);text-align:center}
.pw-body{padding:20px 22px 28px;background:var(--surface);flex:1}
.pw-h1{margin:0 0 16px;font-size:22px;font-weight:700;color:var(--heading)}
.pw-stats{display:flex;background:#fff;border-radius:10px;margin-bottom:16px;overflow:hidden;border:1px solid var(--divider)}
.pw-stats>div{flex:1;padding:16px;text-align:center;border-right:1px solid var(--divider)}
.pw-stats>div:last-child{border-right:none}
.pw-stats span{display:block;font-size:12.5px;color:var(--body)}
.pw-stats b{font-size:26px;color:var(--heading)}
.pw-alert{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid #F6CFD3;border-left:3px solid var(--occ-red);
  border-radius:8px;padding:13px 15px;margin-bottom:16px;cursor:pointer;text-align:left;width:100%}
.pw-alert:hover{background:#FFFAFA}
.pw-alert-go{margin-left:auto;color:var(--occ-red);font-weight:600;font-size:12.5px;white-space:nowrap}
.pw-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pw-card{background:#fff;border:1px solid var(--divider);border-radius:10px;padding:15px}
.pw-card h4{margin:0 0 10px;font-size:15px;color:#0B4A85;font-weight:600}
.pw-mini{border:1px solid var(--divider);border-radius:7px;padding:10px 12px;margin-bottom:8px}
.pw-mini b{display:block;font-size:12.5px;color:var(--heading)}
.pw-mini span{font-size:11.5px;color:var(--muted)}
.pw-crumb{font-size:14px;color:var(--heading);margin-bottom:14px;font-weight:600}
.pw-crumb a{color:var(--occ-red);cursor:pointer}
.pw-crumb span{color:var(--muted);margin:0 4px}
.pw-sec{background:#fff;border:1px solid var(--divider);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.pw-sec h3{margin:0 0 4px;font-size:16px;color:#0B4A85;font-weight:600}
.pw-sec-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.pw-sec-hd p{margin:0;font-size:12.5px;color:var(--muted);max-width:560px;line-height:1.5}
.pw-pill{background:#FDECEE;color:var(--occ-red);font-size:12px;font-weight:700;border-radius:100px;padding:4px 12px;white-space:nowrap}
.pw-pill.ok{background:#EBF7EE;color:#1B6B36}
.pw-tbl{width:100%;border-collapse:collapse;font-size:13px}
.pw-tbl th{background:#EEF3FA;color:var(--heading);text-align:left;font-weight:600;font-size:12.5px;padding:9px 12px;border:1px solid #DCE4EE}
.pw-tbl td{padding:10px 12px;border:1px solid #E4E9F0;color:var(--body)}
.pw-tbl td.b{font-weight:600;color:var(--heading)}
.pw-tbl td.r{text-align:right}
.pv-btn{background:var(--occ-red);color:#fff;border:none;border-radius:6px;padding:7px 15px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pv-btn:hover{background:#A81A20}
.pv-btn.ghost{background:#fff;color:#5B4B9E;border:1px solid #DED6F3}
.pv-btn.ghost:hover{background:#F4F1FB}
.pv-ok{color:#1B6B36;font-weight:600;font-size:12.5px}
.pv-wait{color:#9E1B44;font-weight:600;font-size:12.5px}
.pv-fail{color:#A6120C;font-weight:600;font-size:12.5px}
.pw-ord{background:#F7FAFF;border:1px solid #DCE4EE;border-radius:8px;padding:14px;margin-bottom:12px}
.pw-ord-hd{color:#0B4A85;font-weight:700;font-size:14.5px;margin-bottom:8px}
.pw-kv{display:flex;gap:12px;font-size:13px;padding:3px 0}
.pw-kv span{width:150px;flex:0 0 150px;color:var(--muted)}
.pw-paid{background:#EBF7EE;color:#1B6B36;border-radius:5px;padding:2px 9px;font-size:12px;font-weight:600}
.pw-svc{border:1px solid var(--divider);border-radius:8px;padding:13px}
.pw-svc-hd{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap;font-size:13.5px}
.pw-tagd{background:#FFF7E6;color:#8A5300;font-size:11.5px;font-weight:600;border-radius:4px;padding:3px 9px}
.pw-steps{display:flex;gap:4px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.pw-steps span{flex:1;min-width:88px;text-align:center;padding-top:16px;position:relative}
.pw-steps span::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:#D5D9DE}
.pw-steps span.on{color:#1B6B36}
.pw-steps span.on::before{background:#2E844A}
.pw-steps span.cur{color:#0B4A85;font-weight:600}
.pw-steps span.cur::before{background:#0176D3;box-shadow:0 0 0 3px rgba(1,118,211,.2)}

.pw-sub{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.pw-h4{margin:14px 0 4px;font-size:14px;font-weight:600;color:var(--heading)}
.pw-tbl tr.alt td{background:#F7F9FC}
.pw-tbl td.credit{color:#1B6B36;font-weight:600;text-align:right}
.pw-tbl td.credit span{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.pw-tbl td.grand{color:#0B4A85;font-weight:700;text-align:right}
.pw-svc{border:1px solid var(--divider);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.pw-svc-hd{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.pw-svc-ic{width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:#EAF1FB;color:#0B4A85;display:grid;place-items:center}
.pw-svc-tx{flex:1;min-width:0}
.pw-svc-tx b{font-size:13.5px;color:var(--heading);margin-right:8px}
.pw-svc-tx i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:3px}
.pw-ring{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#0176D3 calc(var(--pct)*1%),#E7EBF0 0)}
.pw-ring i{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-style:normal;font-size:10.5px;font-weight:700;color:#0B4A85}
.pw-steps span em{display:block;font-style:normal;font-size:9.5px;color:var(--muted);margin-top:2px}
.pw-svc-ft{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--divider);
  margin-top:12px;padding-top:11px;font-size:12px;color:var(--muted)}
.pw-svc-ft b{color:var(--heading);font-weight:600}
.pw-svc-ft .pv-btn{margin-left:auto}
.pw-page{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.pa-lbl{font-size:12.5px;font-weight:700;color:var(--heading);border-bottom:1px solid var(--divider);padding-bottom:6px;margin-bottom:4px}
.pa-ava{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#FDECEE;display:grid;place-items:center;font-size:14px}
.pa-sh-t{display:flex;align-items:center;gap:9px}
.pa-sh-t b{display:block;font-size:13.5px;color:var(--heading)}
.pa-pill{margin-left:auto;background:#EAF1FB;color:#0B4A85;font-size:11px;font-weight:600;border-radius:100px;padding:3px 11px;white-space:nowrap}
.pa-pill.ok{background:#EBF7EE;color:#1B6B36}
.pa-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:10px}
.pa-grid span{font-size:11px;color:var(--muted)}
.pa-grid b{display:block;font-size:12.5px;color:var(--heading);font-weight:500;margin-top:2px}
.pa-sh-b{margin-top:11px}
.pa-sh-b .pv-btn{width:100%;padding:11px}
.pa-total.grand b{color:#0B4A85;font-weight:700}
.pa-total b.green{color:#1B6B36}

@keyframes secflash{0%{box-shadow:0 0 0 0 rgba(201,31,38,0)}
  18%{box-shadow:0 0 0 4px rgba(201,31,38,.20)}
  100%{box-shadow:0 0 0 0 rgba(201,31,38,0)}}
.pw-sec.flash,.pa-sec.flash{animation:secflash 2.4s ease-out;border-color:#F0B6BA}

/* ---------- PORTAL APP ---------- */
.screen.pa{background:#F2F4F7}
.pa-hd{display:flex;justify-content:space-between;padding:11px 20px 6px;font-size:12.5px;font-weight:600;color:#fff;background:var(--occ-red)}
.pa-top{background:var(--occ-red);color:#fff;padding:6px 18px 16px;font-size:17px;font-weight:700}
.pa-top.nav{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.pa-back{background:none;border:none;color:#fff;font-size:24px;line-height:1;padding:0 2px}
.pa-tabs{display:flex;gap:6px;background:var(--occ-red);padding:0 12px 12px;overflow-x:auto}
.pa-tabs button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:100px;padding:7px 15px;font-size:12.5px;white-space:nowrap}
.pa-tabs button.on{background:#fff;color:var(--occ-red);font-weight:700}
.pa-body{flex:1;overflow-y:auto;padding:14px;position:relative;scroll-behavior:smooth}
.pa-noti{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--divider);border-radius:10px;padding:13px;margin-bottom:10px}
.pa-noti.unread{border-color:#F6CFD3;background:#FFF8F8}
.pa-noti-ic{flex:0 0 32px;height:32px;border-radius:50%;background:#FDECEE;display:grid;place-items:center;font-size:15px}
.pa-noti b{display:block;font-size:13.5px;color:var(--heading)}
.pa-noti-b{display:block;font-size:12px;color:var(--body);line-height:1.5;margin-top:3px}
.pa-noti-t{display:block;font-size:10.5px;color:var(--muted);margin-top:5px}
.pa-empty{padding:40px 20px;text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
.pa-empty span{font-size:11.5px}
.pa-card{background:#EAF1FB;border-radius:12px;padding:15px;margin-bottom:14px;position:relative}
.pa-card b{display:block;font-size:15px;color:#0B4A85;margin-bottom:5px;padding-right:60px}
.pa-sub,.pa-ref{display:block;font-size:12.5px;color:var(--body);margin-top:3px}
.pa-paid{position:absolute;top:12px;right:12px;background:#2E844A;color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:3px 10px}
.pa-sec{background:#fff;border-radius:12px;padding:15px;margin-bottom:14px}
.pa-sec h4{margin:0 0 4px;font-size:15.5px;color:#0B4A85;font-weight:700}
.pa-p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.pa-sh{border-top:1px solid var(--divider);padding:12px 0 0;margin-top:12px}
.pa-sh:first-of-type{border-top:none;margin-top:0;padding-top:0}
.pa-sh-t b{display:block;font-size:13.5px;color:var(--heading)}
.pa-role{font-size:11.5px;color:var(--muted)}
.pa-sh-b{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;flex-wrap:wrap}
.pa-sh-b .pv-btn{padding:9px 18px}
.pa-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--divider);font-size:12.5px}
.pa-item b{font-weight:500;color:var(--heading)}
.pa-item span{white-space:nowrap;color:var(--body)}
.pa-total{display:flex;justify-content:space-between;padding-top:11px;font-size:13.5px}
.pa-total b{color:var(--heading)}
@media (max-width:900px){
  .pw{flex-direction:column}
  .pw-side{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--divider)}
  .pw-side nav{display:flex;gap:6px;overflow-x:auto}
  .pw-nav{white-space:nowrap}
  .pw-bell-panel{right:10px;left:10px;width:auto}
}

/* ---------- MAIL ---------- */
.mail-wrap{display:grid;grid-template-columns:300px 1fr;gap:0;background:#fff;border:1px solid var(--sf-border);border-radius:var(--r);overflow:hidden;min-height:560px}
.mlist{border-right:1px solid var(--divider);background:#FBFBFC;overflow-y:auto;max-height:74vh}
.mlist .mh{padding:13px 15px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--divider)}
.mitem{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--divider);padding:12px 15px;display:block}
.mitem:hover{background:#F2F4F6}
.mitem[aria-current="true"]{background:#fff;box-shadow:inset 3px 0 0 var(--occ-red)}
.mitem .to{font-size:12.5px;font-weight:600;color:var(--heading);margin-bottom:2px}
.mitem .su{font-size:12px;color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .tm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:7px;align-items:center}
.mread{padding:0;overflow-y:auto;max-height:74vh}
.mread-hd{padding:18px 24px;border-bottom:1px solid var(--divider)}
.mread-hd h3{margin:0 0 8px;font-size:19px;letter-spacing:-.015em;color:var(--heading)}
.mread-hd .mt{font-size:12.5px;color:var(--muted)}
.email-body{padding:28px 24px 40px;background:var(--surface)}
.email-card{max-width:648px;margin:0 auto;background:#fff;border:1px solid #D6D6D6;border-radius:6px;overflow:hidden}
.email-head{display:flex;align-items:center;justify-content:center;padding:20px 26px;border-bottom:1px solid #D6D6D6}
.brand-logo{display:block;width:273px;height:40px;max-width:100%}
.email-in{padding:22px 24px 26px;color:#1B5FBF;font-size:14px;line-height:1.62}
.email-in p{margin:0 0 14px}
.email-in .greet{color:#111;font-weight:700}
.email-note{font-size:12.5px;color:#6C757D;line-height:1.6}
.email-track{background:#F2F7FD;border:1px solid #D6E4F5;border-radius:8px;padding:15px 17px;margin:0 0 16px}
.email-track b{display:block;font-size:14px;color:#0B4A85;margin-bottom:6px}
.email-track p{margin:0 0 12px !important;font-size:13px;color:#41556B;line-height:1.6}
.et-btns{display:flex;gap:9px;flex-wrap:wrap}
.et-b{background:var(--occ-red);color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:12.5px;font-weight:600}
.et-b:hover{background:#A81A20}
.et-b.ghost{background:#fff;color:#0B4A85;border:1px solid #C3D8F0}
.et-b.ghost:hover{background:#EAF1FB}
.email-ask{color:#1B5FBF}
.email-sig{margin-top:18px !important;color:#111}
.email-sig b i{font-style:italic;font-weight:700}
.email-foot{position:relative;border-top:1px solid #D6D6D6;padding:22px 24px 20px;text-align:center;overflow:hidden}
.soc{display:flex;gap:11px;justify-content:center;margin-bottom:16px;position:relative;z-index:2}
.soc-i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.soc-i.li{background:#0A66C2}
.soc-i.yt{background:#FF0000;font-size:12px}
.soc-i.fb{background:#1877F2;font-family:Georgia,serif}
.foot-mail{color:var(--occ-red);font-size:13px;margin-bottom:12px;position:relative;z-index:2}
.foot-nav{font-size:12.5px;color:#333;margin-bottom:12px;position:relative;z-index:2}
.foot-nav s{color:#999;text-decoration:none;margin:0 5px}
.foot-cr{font-size:12px;color:#333;position:relative;z-index:2}
.foot-swoosh{position:absolute;right:0;bottom:0;width:190px;height:86px;z-index:1;opacity:.55}
.expired-strip{background:#FDF0F4;border:1px solid #F6CFDC;color:#9E1B44;padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:18px;font-weight:500}

/* ---------- VERIFF PHONE ---------- */
.veriff-stage{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.veriff-stage.solo{justify-content:center}
.phone{width:340px;flex:0 0 340px;background:#000;border-radius:38px;padding:9px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.screen{background:#fff;border-radius:30px;overflow:hidden;height:690px;display:flex;flex-direction:column;position:relative}
.statusbar{display:flex;justify-content:space-between;padding:12px 22px 4px;font-size:13px;font-weight:600;color:#111;flex:0 0 auto;z-index:3}
.statusbar.on-dark{color:#fff;position:absolute;top:0;left:0;right:0}
.vf-body{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.vf-pad{padding:8px 26px 22px;display:flex;flex-direction:column;flex:1}
.vf-top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.vf-x{background:none;border:none;font-size:23px;color:#0B2B26;line-height:1;padding:0}
.vf-logo{font-weight:700;font-size:21px;color:var(--vf-dark);letter-spacing:-.03em;display:flex;align-items:center;gap:5px}
.vf-leaf{width:14px;height:17px;background:var(--vf-mint);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 45%)}
.vf-h1{font-size:25px;font-weight:700;color:var(--vf-dark);letter-spacing:-.03em;line-height:1.2;margin:8px 0 12px}
.vf-p{font-size:15px;color:#3E524E;line-height:1.5;margin:0 0 8px}
.vf-illus{flex:1;display:grid;place-items:center;padding:14px 0}
.vf-circle{width:190px;height:190px;border-radius:50%;background:#E4F8F2;display:grid;place-items:center;position:relative}
.vf-circle .shield{position:absolute;right:-6px;top:34px;width:52px;height:60px;background:var(--vf-mint);clip-path:polygon(50% 0,100% 16%,100% 62%,50% 100%,0 62%,0 16%);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700}
.vf-cta{background:var(--vf-dark);color:#fff;border:none;border-radius:9px;padding:16px;font-size:16px;font-weight:600;width:100%;margin-top:6px}
.vf-cta:hover{background:#154039}
.vf-cta:disabled{background:#D6DCDB;color:#8B9997}
.vf-cta.mint{background:var(--vf-dark);color:var(--vf-mint);box-shadow:0 0 0 2px var(--vf-mint)}
.vf-fine{font-size:11px;color:#7C8C89;text-align:center;line-height:1.5;margin-top:14px}
.vf-cam{position:absolute;inset:0;background:linear-gradient(160deg,#2E4A45 0%,#203632 40%,#16413B 100%);display:flex;flex-direction:column;padding:52px 20px 24px}
.vf-cam h4{color:#fff;font-size:20px;font-weight:700;text-align:center;margin:8px 18px 20px;line-height:1.28}
.vf-frame{background:rgba(255,255,255,.09);border-radius:12px;padding:16px;margin-bottom:auto}
.idcard{background:#F6F3EC;border:1.5px solid #2B3E86;border-radius:4px;padding:9px 10px;font-size:7.5px;line-height:1.4;color:#1B2B5E;font-family:Georgia,serif}
.idcard .ttl{text-align:center;font-weight:700;font-size:7px;letter-spacing:.02em}
.idcard .rows{display:flex;justify-content:space-between;margin-top:7px;gap:8px}
.idcard .stamp{width:34px;height:34px;border:1.5px solid #B0293A;border-radius:50%;opacity:.55;margin-left:auto}
.idcard.back{background:#EFEAE0}
.idcard.back .band{height:14px;background:#2B2B2B;margin:6px -10px}

<body>

<div id="appbar">
  <div class="brandmark"><span class="dot"></span>OCC <small>eKYC Flow</small></div>
  <nav id="tabs" role="tablist"></nav>
  <div class="chrome-actions">
    <span class="clock" id="clock"></span>
    <button class="cbtn" data-ff="24">Skip ahead 24h</button>
    <button class="cbtn" id="btn-log">Activity log</button>
    <button class="cbtn" id="btn-reset">Reset</button>
  </div>
</div>

<div id="stage">
  <div id="views">
    <section class="view active" id="view-crm"></section>
    <section class="view" id="view-mail"></section>
    <section class="view" id="view-veriff"></section>
    <section class="view" id="view-web"></section>
    <section class="view" id="view-app"></section>
    <section class="view" id="view-admin"></section>
    <section class="view" id="view-buffer"></section>
  </div>
  <aside id="rail"><h4>System activity</h4><div id="logitems"></div></aside>
</div>

<div id="scrim"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   STATE
   ============================================================ */
const HOUR = 3600e3, DAY = 24*HOUR;
let clockOffset = 0;
const now = () => Date.now() + clockOffset;

const SEED = () => ({
  order:{ number:'00006241', amount:'USD 1,666.01', subsidiary:'One IBC Limited — Hong Kong',
          type:'Sales Order', priority:'Level 3', start:'8/5/2026', reissues:[],
          contact:{ name:'Nguyen Thi Mai Anh', email:'maianh@apexcorpsec.com',
                    role:'Company Secretary · Apex Corporate Services', isStakeholder:false } },
  stakeholders:[
    {id:'SH-14737', name:'JAIMIN MAHENDRABHAI PATEL', role:'Director', dob:'12/03/1985', doc:'Z4821993', status:'not_sent', sentAt:null, expiresAt:null, verifiedAt:null, docType:null},
    {id:'SH-14738', name:'JAIMIN MAHENDRA PATEL',      role:'Shareholder', dob:'05/09/1990', doc:'R7719042', status:'not_sent', sentAt:null, expiresAt:null, verifiedAt:null, docType:null},
    {id:'SH-14739', name:'JAIMIN M. PATEL',            role:'UBO', dob:'22/11/1978', doc:'K3350118', status:'not_sent', sentAt:null, expiresAt:null, verifiedAt:null, docType:null}
  ],
  mails:[], queue:[], buffer:[], log:[], notis:[], crmNotis:[],
  ui:{ tab:'crm', mail:null, session:null, crmBell:false, webView:'order', bell:false, flash:false, appView:'noti', appTab:'overview', scenario:'auto', ocr:'ok', apiFails:false, hasApp:false, seq:1 }
});
let S = SEED();

const SUBJECT = 'KYC verification required for Sales Order 00006241';
const BODY =
`Dear {{ContactName}},

Order 00006241 for {{Subsidiary}} needs identity verification from the people listed below.

You are receiving all links because you are the contact on this order. Forward each link to the person it names — a link verifies only that individual, and cannot be completed by anyone else.

{{VerificationList}}

Every link works for 24 hours. This email updates itself — each person's row shows whether they have finished, so you can come back to it to see where things stand.

One IBC Client Services`;

const REISSUE_BODY =
`Dear {{ContactName}},

Here is a new set of verification links for Order 00006241, valid for the next 24 hours. The previous links no longer work, so please forward these instead.

{{VerificationList}}

One IBC Client Services`;

const RM = { name:'Trang Nguyen', email:'trang.n@oneibc.com' };
const REISSUE_CAP = 3;

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!==undefined)n.innerHTML=h; return n;};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh = id => S.stakeholders.find(x=>x.id===id);
const fmtClock = t => new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const nextId = p => p + '-' + String(S.ui.seq++).padStart(4,'0');

function log(src, msg){
  S.log.unshift({t:now(), src, msg});
  if(S.log.length>120) S.log.pop();
}

function effStatus(s){
  if(s.status==='sent' || s.status==='in_progress'){
    if(s.expiresAt && now() > s.expiresAt) return 'expired';
  }
  return s.status;
}
const STATUS_META = {
  not_sent:{t:'Not sent', c:'b-idle'},
  sent:{t:'Link sent', c:'b-sent'},
  in_progress:{t:'In progress', c:'b-prog'},
  review:{t:'Awaiting admin review', c:'b-review'},
  verified:{t:'Passed KYC', c:'b-ok'},
  declined:{t:'Verification failed', c:'b-fail'},
  expired:{t:'Link expired', c:'b-exp'}
};
function ago(t){
  const d = Math.max(0, now()-t);
  if(d < 60000) return 'just now';
  if(d < 3600e3){ const m=Math.floor(d/60000); return m+(m>1?' minutes ago':' minute ago'); }
  if(d < 86400e3){ const h=Math.floor(d/3600e3); return h+(h>1?' hours ago':' hour ago'); }
  const dd = Math.floor(d/86400e3);
  return dd===1 ? 'a day ago' : dd+' days ago';
}
function crmNotify(title, body){
  S.crmNotis.unshift({ id:nextId('CN'), at:now(), read:false, title, body });
}
function badge(st){ const m=STATUS_META[st]; return `<span class="badge ${m.c}">${m.t}</span>`; }

function remaining(s){
  const st = effStatus(s);
  if(st==='verified') return `<span class="countdown">Done ${s.verifiedAt?fmtClock(s.verifiedAt):''}</span>`;
  if(st==='expired')  return `<span class="countdown dead">Expired — resend needed</span>`;
  if(!s.expiresAt)    return `<span class="countdown">—</span>`;
  const ms = s.expiresAt - now();
  const h = Math.floor(ms/HOUR), m = Math.floor((ms%HOUR)/60000);
  return `<span class="countdown ${h<4?'warn':''}">${h}h ${String(m).padStart(2,'0')}m left</span>`;
}
const allVerified = () => S.stakeholders.every(s=>s.status==='verified');

/* ============================================================
   SHELL
   ============================================================ */
const TABS = [
  {k:'crm',    label:'CRM · Salesforce'},
  {k:'mail',   label:'Contact inbox', count:()=>S.mails.filter(m=>!m.read).length},
  {k:'web',    label:'Portal · Web', count:()=>S.notis.filter(n=>!n.read).length},
  {k:'app',    label:'Portal · App', count:()=>S.notis.filter(n=>!n.read).length}
];

function renderTabs(){
  const n = $('#tabs'); n.innerHTML='';
  TABS.forEach(t=>{
    const c = t.count ? t.count() : 0;
    const b = el('button','tab', esc(t.label) + (c? ` <span class="count">${c}</span>`:''));
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', S.ui.tab===t.k);
    b.onclick = ()=>{ S.ui.tab=t.k; render(); };
    n.appendChild(b);
  });
}

function render(){
  renderTabs();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+S.ui.tab).classList.add('active');
  ({crm:renderCRM, mail:renderMail, web:renderWeb, app:renderApp, veriff:renderVeriff, admin:renderAdmin, buffer:renderBuffer})[S.ui.tab]();
  renderLog();
  $('#clock').textContent = 'System time: ' + fmtClock(now());
}

function renderLog(){
  const n = $('#logitems'); n.innerHTML='';
  if(!S.log.length){ n.appendChild(el('div','logitem','<span style="color:#5E6670">No events yet.</span>')); return; }
  S.log.forEach(e=>{
    n.appendChild(el('div','logitem',
      `<span class="ls ${e.src}">${e.src}</span>${esc(e.msg)}<div class="lt">${fmtClock(e.t)}</div>`));
  });
}

/* ============================================================
   1. CRM
   ============================================================ */
function renderCRM(){
  const v = $('#view-crm');
  const pass = allVerified();
  const rows = S.stakeholders.map((s,i)=>{
    const st = effStatus(s);
    return `<tr>
      <td class="sub">${i+1}</td>
      <td><a class="link" href="#" onclick="return false">${s.id}</a></td>
      <td class="nm">${esc(s.name)}<div class="sub">${s.role}</div></td>
      <td>${s.dob}</td><td class="mono">${s.doc}</td>
      <td>${badge(st)}</td>
      <td>${remaining(s)}</td>
    </tr>`;
  }).join('');

  const unread = S.crmNotis.filter(n=>!n.read).length;
  const panel = S.ui.crmBell ? `<div class="sfg-panel">
      <div class="sfg-panel-hd"><b>Notifications</b>
        <span><a id="crm-readall">Mark all as read</a><button class="sfg-x" id="crm-close">×</button></span></div>
      <div class="sfg-panel-bd">
        ${S.crmNotis.length ? S.crmNotis.map(n=>`
          <button class="sfg-item ${n.read?'':'unread'}" data-cn="${n.id}">
            <span class="sfg-ico">⚡</span>
            <span class="sfg-tx"><b>${esc(n.title)}</b><span>${esc(n.body)}</span>
              <i>${ago(n.at)}${n.read?'':'<em class="sfg-udot"></em>'}</i></span>
          </button>`).join('')
        : `<div class="sfg-empty">No notifications.</div>`}
      </div>
    </div>` : '';

  v.innerHTML = `
  <div class="sfg">
    <span class="sfg-app"><span class="sfg-grid">⠿</span><span class="sfg-cloud">☁</span></span>
    <div class="sfg-search"><span>⌕</span> Search...</div>
    <div class="sfg-ic">
      <span>★</span><span>＋</span><span>☁</span><span>?</span><span>⚙</span>
      <button class="sfg-bell ${unread?'on':''}" id="crm-bell">🔔${unread?'<i class="sfg-dot"></i>':''}</button>
      <span class="sfg-av">👤</span>
    </div>
    ${panel}
  </div>
  <div class="sf-tabbar"><span class="app">RM Leader</span><span class="sub">Order · ${S.order.number}</span></div>
  <div class="sf-card" style="border-radius:0 0 var(--r) var(--r);border-top:none">
    <div class="sf-hd">
      <div class="sf-obj">
        <div class="sf-icon">▤</div>
        <div><div class="lbl">Order</div><div class="val">${S.order.number}</div></div>
      </div>
      <div class="sf-actions">
        <button class="sfbtn primary" id="btn-checkkyc">Check KYC</button>
        <button class="sfbtn" disabled>Generate SO Completed PDF</button>
        <button class="sfbtn" disabled>Incorporation Form</button>
        <button class="sfbtn" ${pass?'':'disabled'}>Submit for Approval</button>
      </div>
    </div>
    <div class="sf-meta">
      <div><div class="k">Priority</div><div class="v">${S.order.priority}</div></div>
      <div><div class="k">Order Amount</div><div class="v">${S.order.amount}</div></div>
      <div><div class="k">Order Start Date</div><div class="v">${S.order.start}</div></div>
      <div><div class="k">Pass KYC</div><div class="v pk ${pass?'on':''}"><span class="bulb"></span>
        <span>${pass?'All 3 of 3 stakeholders':S.stakeholders.filter(s=>s.status==='verified').length+' of 3 stakeholders'}</span></div></div>
      <div><div class="k">Subsidiary</div><div class="v">${S.order.subsidiary}</div></div>
      <div><div class="k">Order Contact</div><div class="v">${esc(S.order.contact.name)}
        <div class="sub" style="font-weight:400">${esc(S.order.contact.role)}</div></div></div>
    </div>
    <div class="sf-path">
      <div class="step done">New</div>
      <div class="step ${pass?'done':'current'}">KYC Processing</div>
      <div class="step ${pass?'current':''}">Service Processing</div>
      <div class="step">Cancelled</div>
      <div class="step">Completed</div>
    </div>
  </div>

  <div class="sf-card">
    <div class="sf-sub">
      <button>Orders</button><button aria-selected="true">StakeHolder</button>
      <button>Checklist Documents</button><button>Work Orders</button><button>Check KYC</button>
    </div>
    <div class="rl-hd">
      <div><div class="t">StakeHolders (3)</div></div>
    </div>
    <table class="sf">
      <thead><tr><th></th><th>Stakeholder ID</th><th>Stakeholder Name</th><th>Date of Birth</th>
      <th>Passport / ID</th><th>KYC Status</th><th>Link validity</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>

  ${pass ? `<div class="notice blue" style="max-width:760px"><span>✓</span><div>
    All three stakeholders have passed KYC. The <b>Pass KYC</b> flag on the Order turns green and <b>Submit for Approval</b> unlocks.</div></div>`:''}
  `;
  $('#btn-checkkyc').onclick = openKycModal;
  const cb = $('#crm-bell');
  if(cb) cb.onclick = ()=>{ S.ui.crmBell = !S.ui.crmBell; render(); };
  const cc = $('#crm-close');
  if(cc) cc.onclick = ()=>{ S.ui.crmBell = false; render(); };
  const ra = $('#crm-readall');
  if(ra) ra.onclick = ()=>{ S.crmNotis.forEach(n=>n.read=true); log('crm','Staff marked all notifications as read'); render(); };
  document.querySelectorAll('[data-cn]').forEach(b=> b.onclick = ()=>{
    const n = S.crmNotis.find(x=>x.id===b.dataset.cn); if(n) n.read = true;
    S.ui.crmBell = false; render();
  });
}

/* ============================================================
   2. CHECK KYC MODAL
   ============================================================ */
let kycStep = 1, kycSel = new Set(), kycTok = {};

const fmtDT = t => { if(!t) return '—'; const d=new Date(t), p=n=>String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}, ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`; };
const mkToken = () => Array.from({length:32},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join('');

const KYC_BADGE = { not_sent:['Not Sent','k-idle'], sent:['Sent','k-sent'], in_progress:['Sent','k-sent'],
  expired:['Expired','k-exp'], review:['In Review','k-rev'], declined:['Failed','k-fail'], verified:['Passed','k-pass'] };
const kbadge = st => `<span class="kyc-badge ${KYC_BADGE[st][1]}">${KYC_BADGE[st][0]}</span>`;

function openKycModal(){
  kycStep = 1;
  kycSel = new Set(S.stakeholders.filter(s=>effStatus(s)!=='verified').map(s=>s.id));
  kycTok = {};
  renderKycModal();
  $('#scrim').classList.add('open');
}

function renderKycModal(){
  const passed  = S.stakeholders.filter(s=>effStatus(s)==='verified');
  const sendable = S.stakeholders.filter(s=>effStatus(s)!=='verified');
  const c = S.order.contact;

  const head = `
    <div class="kyc-hd">
      <button class="kyc-x" id="m-x">✕</button>
      <h3>Send Email KYC</h3>
      <div class="kyc-sub">Sales Order ${S.order.number}</div>
    </div>`;

  if(kycStep === 1){
    const rowsSend = sendable.map(s=>{
      const st = effStatus(s);
      return `<tr>
        <td class="cbx"><input type="checkbox" data-sel="${s.id}" ${kycSel.has(s.id)?'checked':''}></td>
        <td class="nm">${esc(s.name)}</td>
        <td>${s.role}</td>
        <td>${kbadge(st)}</td>
        <td>${fmtDT(s.sentAt)}</td>
        <td>${fmtDT(s.expiresAt)}</td>
      </tr>`;
    }).join('');

    const rowsPassed = passed.map(s=>`<tr>
        <td class="cbx"></td>
        <td class="nm">${esc(s.name)}</td>
        <td>${s.role}</td>
        <td>${kbadge('verified')}</td>
        <td>${fmtDT(s.sentAt)}</td>
        <td>${fmtDT(s.verifiedAt)}</td>
      </tr>`).join('');

    $('#modal').innerHTML = head + `
      <div class="kyc-bd">
        <div class="kyc-banner">Email will be sent to Order Contact: ${esc(c.name)} · ${esc(c.email)}</div>
        <div class="kyc-count" id="m-count"></div>

        <div class="kyc-sec">

          <span class="kyc-sec-a">
            <button class="sfbtn" id="m-all">Select all</button>
            <button class="sfbtn" id="m-clear">Clear</button>
          </span>
        </div>
        ${sendable.length ? `<table class="kyc">
          <colgroup><col class="c-cbx"><col class="c-nm"><col class="c-ty"><col class="c-st"><col class="c-d1"><col class="c-d2"></colgroup>
          <thead><tr><th class="cbx"></th><th>Name</th><th>Type</th><th>KYC Status</th>
            <th>KYC Sent Date</th><th>Link Expiry Date</th></tr></thead>
          <tbody>${rowsSend}</tbody></table>`

        <table class="kyc">
          <colgroup><col class="c-cbx"><col class="c-nm"><col class="c-ty"><col class="c-st"><col class="c-d1"><col class="c-d2"></colgroup>
          <thead><tr><th class="cbx"></th><th>Name</th><th>Type</th><th>KYC Status</th>

    const upd = ()=>{

    upd();

            <select class="rt-sel"><option>Salesforce Sans</option></select>

            <span class="rt-g"><button class="rt-b">☰</button><button class="rt-b">≡</button>

              items: ids,
              tokenOf: id => kycTok[id],
              statusOf: () => 'sent',

              dead: false,
              interactive: false,
              editable: true,
              intro: `Dear ${esc(c.name)},<br>Please complete KYC verification for the following stakeholder(s) of Sales Order <b>${S.order.number}</b>:`,
              outro: 'Each verification link is unique. Please forward the correct link to the matching stakeholder.<br>Thank you.'
            })}

        </div>
      </div>
      <div class="kyc-ft">
        <button class="sfbtn" id="m-back">Back</button>
        <button class="sfbtn" id="m-cancel">Cancel</button>

      </div>`;

    bindCopy();
  document.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=>{
    const target = b.dataset.go==='auto' ? (S.ui.hasApp?'app':'web') : b.dataset.go;
    if(target==='web'){ S.ui.tab='web'; S.ui.webView='order'; S.ui.bell=false; }
    else { S.ui.tab='app'; S.ui.appView='order'; S.ui.appTab='overview'; }
    S.ui.flash = true;
    log('portal', `Contact jumped from the email to the ${target==='web'?'web portal (no app installed)':'mobile app'}`);
    render();
  });
    $('#m-back').onclick = ()=>{ kycStep = 1; renderKycModal(); };
    $('#m-send').onclick = ()=>{
      const txt = n => $(n).innerHTML.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').trim();
      const body = txt('#m-intro') + '\n\n{{VerificationList}}\n\n' + txt('#m-outro');
      sendKycMails(ids, $('#m-subj').value, body, kycTok);
      $('#scrim').classList.remove('open');
      S.ui.mail = S.mails[0].id;
      S.ui.tab = 'mail'; render();
    };
  }

  $('#m-x').onclick = $('#m-cancel').onclick = ()=> $('#scrim').classList.remove('open');
}

$('#scrim').addEventListener('click', e=>{ if(e.target.id==='scrim') $('#scrim').classList.remove('open'); });

/* One email to the Contact, carrying a separate link per stakeholder */
function issueBatch(ids, subject, body, kind, tokens){
  S.mails.filter(m=>m.active).forEach(m=>{ m.active=false; });
  const at = now(), exp = at + DAY;
  ids.forEach(id=>{
    const s = sh(id);
    s.status='sent'; s.sentAt=at; s.expiresAt=exp;
    s.token = (tokens && tokens[id]) || Math.random().toString(36).slice(2,10);
  });
  S.mails.unshift({ id:nextId('EM'), to:S.order.contact.email, toName:S.order.contact.name,
    subject, body, kind, items:ids.slice(), sentAt:at, expiresAt:exp, read:false, active:true });
  S.notis.forEach(n=>{ n.stale = true; });
  S.notis.unshift({ id:nextId('NT'), at, items:ids.slice(), expiresAt:exp, read:false, stale:false });
  return exp;
}

function sendKycMails(ids, subject, body, tokens){
  const exp = issueBatch(ids, subject, body, 'invite', tokens);
  log('mail', `Sent 1 email to ${S.order.contact.email} — ${ids.length} verification links · expire ${fmtClock(exp)}`);
  log('crm', `Staff clicked Check KYC on Order ${S.order.number} — ${ids.map(i=>sh(i).id).join(', ')}`);
  log('portal', `Notification pushed to web portal and mobile app — ${ids.length} stakeholders to verify`);
}

/* Reissue only for people who have not finished */
function outstanding(){
  return S.stakeholders.filter(s=>['not_sent','sent','in_progress','expired'].includes(effStatus(s))).map(s=>s.id);
}
function reissueSelfService(){
  const ids = outstanding();
  S.order.reissues = (S.order.reissues||[]).concat(now());
  issueBatch(ids, 'Your new verification links for Order 00006241', REISSUE_BODY, 'reissue');
  log('mail', `Self-service request — ${ids.length} new links sent to ${S.order.contact.email}`);
  log('portal', `Portal notification refreshed with the new link set`);
  return ids;
}
const reissuesLeft = () => REISSUE_CAP - (S.order.reissues||[]).filter(t=> now()-t < DAY).length;

const splitBody = body => {
  const parts = String(body).split('{{VerificationList}}');
  return { intro:(parts[0]||'').trim(), outro:(parts[1]||'').trim() };
};
const textToHtml = s => esc(s).replace(/\n/g,'<br>');

/* Bản render email dùng chung cho preview trong popup và hộp thư khách */
function emailCardHtml(cfg){
  const rows = cfg.items.map(id=>{
    const s = sh(id);
    const st = cfg.statusOf ? cfg.statusOf(id) : 'sent';
    const dead = !!cfg.dead || st==='expired';
    const url = `https://example.com/kyc/verify?token=${cfg.tokenOf(id)||'—'}`;
    let cell;
    if(st==='verified')      cell = `<span class="lk-done">✓ Verified</span>`;
    else if(st==='review')   cell = `<span class="lk-wait">Under review</span>`;
    else if(st==='declined') cell = `<span class="lk-fail">Could not verify</span>`;
    else cell = `<span class="lk-cell">
        <button class="lk-a ${dead?'dead':''}" ${cfg.interactive?`data-open="${s.id}"`:''}
          title="${dead?'Link expired — open to request a new set':'Verification link'}">${url}</button>
        <button class="lk-copy" data-copy="${esc(url)}" title="Copy link"
          aria-label="Copy verification link for ${esc(s.name)}">${COPY_ICON}</button>
        ${dead?'<span class="lk-tag">Expired</span>':''}
      </span>`;
    return `<tr><td class="lk-nm">${esc(s.name)}</td><td class="lk-ty">${s.role}</td><td>${cell}</td></tr>`;
  }).join('');

  const note = cfg.expiresAt
    ? (cfg.dead ? `This link set expired ${fmtClock(cfg.expiresAt)}. Open any link to request a new set.`
                : `All links expire ${fmtClock(cfg.expiresAt)}.`)
    : 'All links expire 24 hours after this email is sent.';

  const ed = cfg.editable;
  const intro = String(cfg.intro).replace(/^(Dear[^<]*,)/, '<span class="greet">$1</span>');

  return `<div class="email-card">
    <div class="email-head">
      <img class="brand-logo" src="${OIBC_LOGO}" alt="One IBC · OffShore CompanyCorp" width="273" height="40">
    </div>
    <div class="email-in">
      <p ${ed?'id="m-intro" contenteditable="true" class="rt-edit"':''}>${intro}</p>
      <table class="lk-tbl">
        <caption>KYC Verification Details</caption>
        <thead><tr><th>Name</th><th>Type</th><th>Verification Link</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="lk-note">${note}</div>
      <p ${ed?'id="m-outro" contenteditable="true" class="rt-edit"':''}>${cfg.outro}</p>
      <div class="email-track">
        <b>Track progress in real time</b>
        <p>The same verification is available in your One IBC Client Portal and mobile app. Sign in to see who has
          already completed KYC, pick up where someone left off, or issue a fresh link if one expires. Status updates
          instantly across email, web and app — you never have to ask us where things stand.</p>
        <span class="et-btns">
          <button class="et-b" ${cfg.interactive?'data-go="auto"':''}>${S.ui.hasApp?'Open in the One IBC app →':'Open Client Portal →'}</button>
        </span>
      </div>
      <p class="email-note">You are receiving this because you are the ${esc(S.order.contact.role)}
        on Order ${S.order.number} — ${esc(S.order.subsidiary)}. This email contains no dates of birth and no
        document numbers. Verification is carried out by Veriff; One IBC does not store original ID images.</p>
      <p class="email-ask">Need help?<br>Reply to this email; or<br>Contact your relationship manager,
        ${RM.name} — ${RM.email}</p>
      <p class="email-sig"><b><i>Best Regards,</i></b><br>One IBC Team</p>
    </div>
    <div class="email-foot">
      <div class="soc"><span class="soc-i li">in</span><span class="soc-i yt">▶</span><span class="soc-i fb">f</span></div>
      <div class="foot-mail">support@offshorecompanycorp.com</div>
      <div class="foot-nav">Privacy Policy <s>•</s> About Us <s>•</s> FAQs <s>•</s> Contacts Us <s>•</s> Unsubscribe</div>
      <div class="foot-cr">1997 - ${new Date(now()).getFullYear()} Offshore Company Corp. All Rights Reserved.</div>
      <svg class="foot-swoosh" viewBox="0 0 200 90" aria-hidden="true">
        <path fill="#F0F0F0" d="M200 0C120 6 40 34 0 90h200V0z"/>
        <path fill="#C8102E" d="M200 34c-46 8-84 27-108 56h108V34z"/>
      </svg>
    </div>
  </div>`;
}

function bindCopy(){
  document.querySelectorAll('[data-copy]').forEach(b=> b.onclick = ()=>{
    copyText(b.dataset.copy);
    const old = b.innerHTML;
    b.classList.add('ok'); b.innerHTML = '<span class="lk-ok">Copied</span>';
    setTimeout(()=>{ b.innerHTML = old; b.classList.remove('ok'); }, 1200);
  });
}

function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt)); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function renderMail(){
  const v = $('#view-mail');
  if(!S.mails.length){
    v.innerHTML = `<div class="view-hd"><div><h2>Contact inbox</h2>
      <p>The customer side of the flow. No email yet — go back to the CRM tab and click <b>Check KYC</b>.</p></div></div>
      <div class="empty"><strong>Inbox empty</strong>The email lands here the moment staff sends it from the CRM.</div>`;
    return;
  }
  if(!S.ui.mail || !S.mails.find(m=>m.id===S.ui.mail)) S.ui.mail = S.mails[0].id;
  const m = S.mails.find(x=>x.id===S.ui.mail);
  m.read = true;
  const mailDead = now() >= m.expiresAt || !m.active;

  const list = S.mails.map(x=>{
    const xexp = now()>=x.expiresAt || !x.active;
    return `<button class="mitem" aria-current="${x.id===m.id}" data-id="${x.id}">
      <div class="to">${esc(x.toName)}</div>
      <div class="su">${esc(x.subject)}</div>
      <div class="tm">${fmtClock(x.sentAt)}
        ${x.kind==='reissue'?'<span class="kindtag new">New link set</span>':''}
        <span class="kindtag cnt">${x.items.length} people</span>
        ${xexp?'<span class="badge b-exp">Expired</span>':'<span class="badge b-sent">Active</span>'}</div>
    </button>`;
  }).join('');

  const remain = m.items.filter(id=>effStatus(sh(id))!=='verified').length;
  const bp = splitBody(m.body
    .replace('{{ContactName}}', S.order.contact.name)
    .replace('{{Subsidiary}}', S.order.subsidiary));

  const emailPane = `
    <div class="mread-hd">
      <h3>${esc(m.subject)}</h3>
      <div class="mt">To <b>${esc(m.toName)} &lt;${esc(m.to)}&gt;</b> · ${fmtClock(m.sentAt)}
        · ${remain?`${remain} of ${m.items.length} still outstanding`:'all done'}</div>
    </div>
    <div class="email-body">
      ${mailDead ? `<div class="expired-strip" style="max-width:648px;margin:0 auto 18px">
        The links in this email expired ${fmtClock(m.expiresAt)}. Click any link to request a new set.</div>`:''}
      ${emailCardHtml({
        items: m.items,
        tokenOf: id => sh(id).token,
        statusOf: id => effStatus(sh(id)),
        expiresAt: m.expiresAt,
        dead: mailDead,
        interactive: true,
        intro: textToHtml(bp.intro),
        outro: textToHtml(bp.outro)
      })}
    </div>`;

  v.innerHTML = `
  <div class="view-hd"><div><h2>${esc(S.order.contact.name)}'s inbox</h2>
    <p>The Contact is not a stakeholder — she is the ${esc(S.order.contact.role)} who holds every link and
       forwards them on. That is why the email carries names and roles only, no identifying data.</p></div>
    <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#5E6670;cursor:pointer;user-select:none">
      <input type="checkbox" id="app-installed-toggle" ${S.ui.hasApp?'checked':''}>
      One IBC app installed on device</label></div>
  <div class="mail-wrap">
    <div class="mlist"><div class="mh">Inbox · ${esc(S.order.contact.email)}</div>${list}</div>
    <div class="mread">${emailPane}</div>
  </div>`;

  const tg = $('#app-installed-toggle');
  if(tg) tg.onchange = ()=>{ S.ui.hasApp = tg.checked; render(); };
  document.querySelectorAll('.mitem').forEach(b=> b.onclick = ()=>{ S.ui.mail=b.dataset.id; render(); });
  bindCopy();
  document.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=>{
    const s = sh(b.dataset.open);
    if(mailDead || effStatus(s)==='expired'){
      S.ui.session = { shId:s.id, step:'expired', docType:null, pick:null };
      log('veriff', `Expired link for ${s.name} opened — self-service reissue page shown`);
    } else {
      if(s.status==='sent') s.status='in_progress';
      S.ui.session = { shId:s.id, step:'intro', docType:null, pick:null };
      log('veriff', `${s.name} opened the Veriff link on mobile`);
    }
    S.ui.tab='veriff'; render();
  });
}

const NAV = ['Dashboard','Companies','Orders','Transaction History','One IBC Club ™','Partnership',
             'News','FAQs','Settings','Support Center','Portal User Guide'];

function kycRowsPortal(items){
  return items.map(id=>{
    const s = sh(id);
    const st = effStatus(s);
    let act;
    if(st==='verified')      act = `<span class="pv-ok">✓ Verified</span>`;
    else if(st==='review')   act = `<span class="pv-wait">Under review</span>`;
    else if(st==='declined') act = `<span class="pv-fail">Could not verify</span>`;
    else if(st==='expired')  act = reissuesLeft()>0
        ? `<button class="pv-btn ghost" data-pnew="1">Get a new link</button>`
        : `<span class="pv-fail">Expired — contact your RM</span>`;
    else act = `<button class="pv-btn" data-pv="${s.id}">Verify now</button>`;
    return { s, st, act };
  });
}

/* Cuộn tới bảng stakeholder khi mở từ notification */
function flashStakeholder(){
  if(!S.ui.flash) return;
  S.ui.flash = false;
  // phải giới hạn trong đúng tab đang mở, vì web và app có cùng id
  const el = document.querySelector(`#view-${S.ui.tab} #sec-stakeholder`);
  if(!el) return;
  el.classList.add('flash');
  const soft = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const box = document.querySelector(`#view-${S.ui.tab} .pa-body`);
  setTimeout(()=>{
    if(box){                                   // app: cuộn trong thân điện thoại
      box.scrollTo({ top: Math.max(0, el.offsetTop - 10), behavior: soft?'auto':'smooth' });
    } else {                                   // web: cuộn cả trang
      el.scrollIntoView({ behavior: soft?'auto':'smooth', block:'center' });
    }
  }, 80);
  setTimeout(()=> el.classList.remove('flash'), 2600);
}

function bindPortal(){
  document.querySelectorAll('[data-pv]').forEach(b=> b.onclick = ()=>{
    const s = sh(b.dataset.pv);
    if(s.status==='sent') s.status='in_progress';
    S.ui.session = { shId:s.id, step:'intro', docType:null, pick:null };
    log('veriff', `${s.name} started verification from the client portal`);
    S.ui.tab='veriff'; render();
  });
  document.querySelectorAll('[data-pnew]').forEach(b=> b.onclick = ()=>{ reissueSelfService(); render(); });
}
