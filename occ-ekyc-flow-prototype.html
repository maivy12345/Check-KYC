      <div class="accepted"><b>ACCEPTED DOCUMENTS</b>Driver's Licence, Residence Permit, Passport, ID Card.</div>
      <button class="shutter" id="vf-snap" aria-label="Capture"></button>
    </div></div>` + browser();
    $('#vf-snap').onclick = ()=>{
      if(S.ui.ocr==='fail'){ ss.step='doctype'; log('veriff','OCR could not identify the document type — manual selection required'); }
      else { ss.step='back'; log('veriff','Front captured — OCR read it as an ID card'); }
      render();
    };
  }

  else if(ss.step==='doctype'){
    const opts=[['ID card','#8E7BE8'],['Passport','#E88FA6'],["Driver's licence",'#E8C48F'],['Residence permit','#7FBFA8']];
    sc.innerHTML = bar() + `<div class="vf-body"><div class="vf-pad">
      <div class="vf-top"><button class="vf-x">×</button><span class="vf-logo">veriff<span class="vf-leaf"></span></span><span style="width:18px"></span></div>
      <h1 class="vf-h1" style="text-align:center">We couldn't identify your document</h1>
      <p class="vf-p" style="text-align:center;font-size:14px">Please select the type of document you are using:</p>
      <div style="margin-top:18px;flex:1">
        ${opts.map(([o,c])=>`<button class="vf-choice" data-doc="${o}" aria-pressed="${ss.docType===o}">
          <span>${o}</span><span class="ic" style="background:${c}"></span></button>`).join('')}
      </div>
      <button class="vf-cta" id="vf-cont" ${ss.docType?'':'disabled'}>Continue</button>
    </div></div>` + browser();
    document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{ ss.docType=b.dataset.doc; render(); });
    $('#vf-cont').onclick = ()=>{ ss.step='back'; log('veriff',`Document type selected manually: ${ss.docType}`); render(); };
  }

  else if(ss.step==='back'){
    sc.innerHTML = `<div class="vf-body"><div class="vf-cam">${bar(1)}
      <h4>Turn your ID card around</h4>
      <div class="vf-frame">${CARD_BACK}</div>
      <div class="accepted">Turn your ID card around and take a photo of the other side.</div>
      <button class="shutter" id="vf-snap2" aria-label="Capture back"></button>
    </div></div>` + browser();
    $('#vf-snap2').onclick = ()=>{ ss.step='selfie'; log('veriff','Back of document captured'); render(); };
  }

  else if(ss.step==='selfie'){
    sc.innerHTML = `<div class="vf-body"><div class="vf-cam" style="background:linear-gradient(180deg,#E9E9E7,#D7D5D0 60%,#C6B79B)">${bar(1)}
      <h4 style="color:#1E2B29">Take a selfie</h4>
      <div class="selfie-oval"></div>
      <div class="accepted" style="color:#2B3A38">Position your face in the oval and hold still.</div>
      <button class="shutter" id="vf-snap3" aria-label="Capture selfie"></button>
    </div></div>` + browser();
    $('#vf-snap3').onclick = ()=>{ ss.step='done'; submitVeriff(); render(); };
  }

  else {
    sc.innerHTML = bar() + `<div class="vf-body"><div class="vf-pad">
      <div class="vf-top"><span style="width:18px"></span><span class="vf-logo">veriff<span class="vf-leaf"></span></span><span style="width:18px"></span></div>
      <div class="vf-illus" style="flex-direction:column">
        <div class="vf-check">✓</div>
        <h1 class="vf-h1" style="text-align:center;font-size:27px">Thank you!</h1>
        <p class="vf-p" style="text-align:center;font-weight:600;color:var(--vf-dark);font-size:16px">
          Your verification data has been successfully submitted.</p>
      </div>
      <button class="vf-cta mint" id="vf-fin">Continue</button>
    </div></div>` + browser();
    $('#vf-fin').onclick = ()=>{
      const st = effStatus(s);
      S.ui.session = null;
      S.ui.tab = st==='review' ? 'admin' : 'crm';
      render();
    };
  }
}

function submitVeriff(){
  const ss = S.ui.session, s = sh(ss.shId);
  const docType = ss.docType || 'ID card';
  s.docType = docType;

  if(S.ui.scenario==='declined'){
    s.status='declined';
    log('veriff', `Veriff DECLINED ${s.name} — selfie did not match the document photo`);
    log('crm', `${s.id} moved to "Verification failed" — staff needs to contact the customer`);
    return;
  }
  if(S.ui.scenario==='review'){
    s.status='review';
    const cands = S.stakeholders.filter(x=>x.id!==s.id && x.status!=='verified').slice(0,1).map(x=>x.id);
    S.queue.unshift({ id:nextId('VR'), claimedId:s.id, candidates:[s.id, ...cands],
      pick:null, status:'pending', at:now(),
      extracted:{ name:'JAIMIN MAHENDRA PATEL', docNo:s.doc, dob:s.dob, docType, country:'India' },
      face:0.71 });
    log('veriff', `Veriff returned a result for ${s.name} but the name matches several records — sent to Admin Verify`);
    return;
  }
  if(S.ui.scenario==='wrong'){
    s.status='review';
    const c = S.order.contact;
    S.queue.unshift({ id:nextId('VR'), claimedId:s.id, candidates:S.stakeholders.map(x=>x.id),
      pick:null, status:'pending', at:now(), mismatch:true,
      extracted:{ name:c.name.toUpperCase(), docNo:'C1180334', dob:'30/07/1988', docType, country:'Viet Nam' },
      face:0.94 });
    log('veriff', `The link for ${s.id} was used by someone else — document is in ${c.name}'s name, matching no stakeholder`);
    log('admin', `${S.order.number}: manual handling required — Contact may have verified in place of a stakeholder`);
    return;
  }
  markVerified(s, docType, 'auto-matched');
}

function markVerified(s, docType, how){
  s.status='verified'; s.verifiedAt=now(); s.docType=docType;
  log('veriff', `Veriff APPROVED ${s.name} (${docType}) — ${how}`);
  log('crm', `${s.id} marked Pass KYC ✓ on Order ${S.order.number}`);
  pushBuffer(s);
  if(allVerified() && !S.order.kycNotified){
    S.order.kycNotified = true;
    log('crm', `All 3 of 3 stakeholders passed KYC — the Order's Pass KYC flag turns green`);
    crmNotify(`All stakeholders have passed KYC.`,
      `All ${S.stakeholders.length} stakeholders on Order ${S.order.number} have completed identity verification. `
      + `The order is cleared to move to Service Processing. Click to view information.`);
    S.ui.crmBell = true;
  }
}

/* ============================================================
   5. ADMIN VERIFY
   ============================================================ */
function renderAdmin(){
  const v = $('#view-admin');
  const pend = S.queue.filter(q=>q.status==='pending');
  const done = S.queue.filter(q=>q.status!=='pending');

  const card = q=>{
    const e = q.extracted;
    const cands = q.candidates.map((cid,i)=>{
      const c = sh(cid);
      const diffs=[];
      if(c.name!==e.name) diffs.push('name differs');
      if(c.dob!==e.dob) diffs.push('date of birth differs');
      if(c.doc!==e.docNo) diffs.push('document number differs');
      return `<label class="cand ${q.pick===cid?'sel':''}">
        <input type="radio" name="pick-${q.id}" value="${cid}" ${q.pick===cid?'checked':''}>
        <span>
          <div class="rl">Record ${String.fromCharCode(65+i)} · ${c.id}</div>
          <b>${esc(c.name)}</b> <span class="sub">· ${c.role}</span>
          <div class="sub">${c.dob} · ${c.doc}</div>
          <div class="diff">${diffs.length?('Differences: <b>'+diffs.join(', ')+'</b>'):'Exact match'}</div>
        </span></label>`;
    }).join('');
    return `<div class="qcard">
      <div class="qcard-hd"><span class="id">${q.id} · ${fmtClock(q.at)}</span>
        ${q.status==='pending'?badge('review'):badge(q.status==='approved'?'verified':'declined')}</div>
      <div class="qcard-bd">
        ${q.mismatch?`<div class="notice amber" style="margin-bottom:14px"><span>⚠</span><div>
          The document is in the name of <b>${esc(q.extracted.name)}</b> — matching no stakeholder on this Order.
          Most likely the Contact or someone else opened the link issued to ${sh(q.claimedId).id}.
          Do not force a match: reject it and have the right person verify again.</div></div>`:''}
        <div class="kv">
          <span class="k">Document type</span><span class="v">${e.docType} · ${e.country}</span>
          <span class="k">Name on document</span><span class="v">${esc(e.name)}</span>
          <span class="k">Document number</span><span class="v mono">${e.docNo}</span>
          <span class="k">Date of birth</span><span class="v">${e.dob}</span>
          <span class="k">Face match</span><span class="v"><span class="score ${q.face<0.85?'low':''}">${Math.round(q.face*100)}%</span></span>
        </div>
        <p class="fieldlabel">Which stakeholder does this submission belong to?</p>
        ${cands}
        ${q.status==='pending'?`<div style="display:flex;gap:8px;margin-top:14px">
          <button class="sfbtn primary" data-ok="${q.id}" ${q.pick?'':'disabled'}>Approve and link</button>
          <button class="sfbtn" data-no="${q.id}">Reject</button></div>`
        :`<p class="hint" style="margin-top:12px">Handled ${fmtClock(q.doneAt)} by an admin.</p>`}
      </div></div>`;
  };

  v.innerHTML = `
    <div class="view-hd"><div><h2>Admin Verify</h2>
      <p>When a document name is a fuzzy match for several stakeholders, the system will not assign it. An admin picks the right record before anything reaches the API buffer.</p></div></div>
    ${pend.length?`<div class="grid2">${pend.map(card).join('')}</div>`
      :`<div class="empty"><strong>Nothing awaiting review</strong>Auto-matched submissions go straight to the API buffer.</div>`}
    ${done.length?`<h3 style="font-size:14px;margin:22px 0 10px;color:var(--muted);font-weight:600">Handled (${done.length})</h3>
      <div class="grid2">${done.map(card).join('')}</div>`:''}`;

  document.querySelectorAll('input[type=radio][name^=pick-]').forEach(r=>{
    r.onchange = ()=>{ S.queue.find(q=>q.id===r.name.replace('pick-','')).pick = r.value; render(); };
  });
  document.querySelectorAll('[data-ok]').forEach(b=> b.onclick = ()=>{
    const q = S.queue.find(x=>x.id===b.dataset.ok);
    q.status='approved'; q.doneAt=now();
    const s = sh(q.pick);
    log('admin', `Admin linked ${q.id} to ${s.id} (${s.name}) and approved`);
    markVerified(s, q.extracted.docType, 'matched manually by an admin');
    render();
  });
  document.querySelectorAll('[data-no]').forEach(b=> b.onclick = ()=>{
    const q = S.queue.find(x=>x.id===b.dataset.no);
    q.status='rejected'; q.doneAt=now();
    const s = sh(q.claimedId); s.status='declined';
    log('admin', `Admin rejected ${q.id} — ${s.id} returns to a failed state`);
    render();
  });
}

/* ============================================================
   6. API BUFFER
   ============================================================ */
function pushBuffer(s){
  const row = { id:nextId('BUF'), shId:s.id, at:now(), status:'pending', tries:0,
    payload:{ orderNumber:S.order.number, stakeholderId:s.id, fullName:s.name,
      documentType:s.docType, documentNumber:s.doc, dateOfBirth:s.dob,
      kycStatus:'PASSED', provider:'veriff', verifiedAt:new Date(s.verifiedAt).toISOString() } };
  S.buffer.unshift(row);
  log('api', `${row.id} queued — KYC payload for ${s.id}`);
  setTimeout(()=>{
    const r = S.buffer.find(x=>x.id===row.id); if(!r || r.status!=='pending') return;
    r.tries++;
    if(S.ui.apiFails){ r.status='failed'; r.error='504 Gateway Timeout from the core system'; log('api',`${r.id} sync failed — ${r.error}`); }
    else { r.status='synced'; r.syncedAt=now(); log('api',`${r.id} synced to the core system`); }
    render();
  }, 1600);
}

function renderBuffer(){
  const v = $('#view-buffer');
  const rows = S.buffer.map(b=>{
    const s = sh(b.shId);
    const st = b.status==='pending'?'<span class="badge b-sent">Sending…</span>'
      : b.status==='synced'?'<span class="badge b-ok">Synced</span>'
      : '<span class="badge b-fail">Failed</span>';
    return `<tr>
      <td class="mono">${b.id}</td>
      <td class="nm">${esc(s.name)}<div class="sub">${s.id}</div></td>
      <td class="sub">${fmtClock(b.at)}</td>
      <td>${st}${b.error?`<div class="sub" style="color:#A6120C">${esc(b.error)}</div>`:''}</td>
      <td class="sub">${b.tries}</td>
      <td>${b.status==='failed'?`<button class="sfbtn" data-retry="${b.id}">Retry</button>`:''}</td>
    </tr>`;
  }).join('');

  const last = S.buffer[0];
  v.innerHTML = `
    <div class="view-hd">
      <div><h2>API Buffer</h2>
        <p>KYC results do not go straight to the core system. Every record sits in this queue so it can be retried when the API fails, and reconciled later.</p></div>
      <div class="toolbar">
        <label class="toggle"><input type="checkbox" id="tg-fail" ${S.ui.apiFails?'checked':''}> Simulate API failure</label>
      </div>
    </div>
    ${S.buffer.length?`<div class="sf-card"><table class="sf">
      <thead><tr><th>Buffer ID</th><th>Stakeholder</th><th>Queued at</th><th>Status</th><th>Attempts</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      ${last?`<details class="pl" open><summary>Sample payload · ${last.id}</summary>
        <div class="payload">${esc(JSON.stringify(last.payload,null,2))}</div></details>`:''}`
    :`<div class="empty"><strong>Queue empty</strong>Records appear here once a stakeholder passes KYC.</div>`}`;

  $('#tg-fail').onchange = e=>{ S.ui.apiFails = e.target.checked; };
  document.querySelectorAll('[data-retry]').forEach(b=> b.onclick = ()=>{
    const r = S.buffer.find(x=>x.id===b.dataset.retry);
    r.status='pending'; r.error=null; log('api',`Retrying ${r.id}`);
    render();
    setTimeout(()=>{
      r.tries++;
      if(S.ui.apiFails){ r.status='failed'; r.error='504 Gateway Timeout from the core system'; }
      else { r.status='synced'; r.syncedAt=now(); log('api',`${r.id} synced on attempt ${r.tries}`); }
      render();
    },1400);
  });
}

/* ============================================================
   CHROME ACTIONS
   ============================================================ */
document.querySelectorAll('[data-ff]').forEach(b=> b.onclick = ()=>{
  const h = +b.dataset.ff;
  clockOffset += h*HOUR;
  log('crm', `Skipped ahead ${h} hours`);
  if(S.ui.session){
    const s = sh(S.ui.session.shId);
    if(now() > s.expiresAt && s.status!=='verified') S.ui.session.step = 'expired';
  }
  render();
});
$('#btn-log').onclick = ()=> $('#rail').classList.toggle('open');
$('#btn-reset').onclick = ()=>{ clockOffset=0; S=SEED(); render(); };

setInterval(()=>{ if(S.ui.tab==='crm') renderCRM(); $('#clock').textContent='System time: '+fmtClock(now()); }, 30000);

log('crm', `Order ${S.order.number} opened — 3 stakeholders not yet verified`);
render();
</script>
